services:
  kiln:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8741:8741"
    environment:
      KILN_TOKEN: ${KILN_TOKEN:?Set KILN_TOKEN to a random token of at least 32 characters}
      KILN_GITHUB_WEBHOOK_SECRET: ${KILN_GITHUB_WEBHOOK_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BOAT_API_KEY: ${BOAT_API_KEY:-}
      AGENT37_API_KEY: ${AGENT37_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-${GIT_AUTHOR_NAME:-}}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-${GIT_AUTHOR_EMAIL:-}}
    volumes:
      - kiln-data:/data
    # Executable: toolchain installers and test binaries run from /tmp.
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    stop_grace_period: 30s
volumes:
  kiln-data:
