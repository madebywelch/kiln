services:
  kiln:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KILN_TOKEN: ${KILN_TOKEN:?Set KILN_TOKEN to a random string of at least 32 characters}
      KILN_MODEL: ${KILN_MODEL:?Set KILN_MODEL to a model id served at KILN_MODEL_URL}
      KILN_MODEL_URL: ${KILN_MODEL_URL:-https://openrouter.ai/api/v1}
      KILN_MODEL_KEY: ${KILN_MODEL_KEY:-}
      KILN_MODEL_PARAMS: ${KILN_MODEL_PARAMS:-}
      KILN_SLACK_BOT_TOKEN: ${KILN_SLACK_BOT_TOKEN:-}
      KILN_SLACK_APP_TOKEN: ${KILN_SLACK_APP_TOKEN:-}
      KILN_SLACK_USERS: ${KILN_SLACK_USERS:-}
      KILN_OUTBOX_URL: ${KILN_OUTBOX_URL:-}
    volumes:
      - kiln-data:/data
    stop_grace_period: 30s
volumes:
  kiln-data:
