name: pr-policy

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-external-pr:
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const body = [
              'Thanks for the interest. KILN is issue-first and does not review unsolicited pull requests.',
              '',
              'Please open an issue instead with the problem, a minimal reproduction, and the expected behavior:',
              `${context.serverUrl}/${owner}/${repo}/issues/new/choose`,
              '',
              'This pull request is being closed automatically. A maintainer may define a scoped contribution on an issue if one is wanted.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body,
            });
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              state: 'closed',
            });
